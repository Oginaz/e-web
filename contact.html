<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nairobi School</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
   <!-- Navigation Section -->
     <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Courses</a>
        <a href="">Contact</a>
     </nav>

     <!-- Hero Section -->
    <section class="hero-contact">
        <h1>Contact Us</h1>
        <p>Have questions or want to learn more? Reach out to us!</p>
    </section>

    <section class="main-section">
        <div class="info">
            <img src="https://images.unsplash.com/photo-1574465636377-7781c5117a0c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
            <h2>Get in Touch</h2>
            <p>Email: info@nairobischool.ac.ke</p>
            <p>Phone: 0700011122</p>
            <p>Location: Nairobi, Kenya</p>
        </div>

        <div class="contact-form">
            <p>We'd love to hear from you! Send us a message and we'll respond as soon as possible.</p>
            <form action ="">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

</body>
</html>
